<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>장비 스킨 제작</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Noto+Sans+KR:wght@400;500;700;900&display=swap">
<style>
:root{
  --bg:#eef1f4; --panel:#ffffff; --panel-2:#e3e8ee; --ink:#18212b; --muted:#56606d;
  --line:#cdd4dc; --steel:#2f4a66; --gold:#9a6a0c; --gold-soft:#f3e3bf; --warn:#b4362b; --ok:#2f7a4a;
  --stage:#dfe5eb;
  --display:"Black Han Sans","Noto Sans KR",system-ui,sans-serif;
  --body:"Noto Sans KR",system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#11161c; --panel:#1a2129; --panel-2:#232c36; --ink:#e7ebf0; --muted:#9aa5b2;
  --line:#2f3a46; --steel:#8fb2d6; --gold:#e3b24d; --gold-soft:#3a2f17; --warn:#f07a6e; --ok:#6fcf97;
  --stage:#1d252e; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#11161c; --panel:#1a2129; --panel-2:#232c36; --ink:#e7ebf0; --muted:#9aa5b2;
  --line:#2f3a46; --steel:#8fb2d6; --gold:#e3b24d; --gold-soft:#3a2f17; --warn:#f07a6e; --ok:#6fcf97;
  --stage:#1d252e; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:14px;line-height:1.5;-webkit-text-size-adjust:100%}
button,input{font:inherit;color:inherit}
a{color:inherit}

/* 사이트 공용 메뉴 */
.sitenav{border-bottom:1px solid var(--line);background:var(--panel)}
.sitenav-in{margin:0 auto;padding:0 16px;display:flex;align-items:center;gap:6px 18px;flex-wrap:wrap;min-height:52px}
.sitenav-brand{font-family:"Black Han Sans","Noto Sans KR",sans-serif;font-size:17px;color:var(--ink);text-decoration:none;letter-spacing:.3px;margin-right:auto;padding:12px 0}
.sitenav-brand b{color:var(--gold);font-weight:400}
.sitenav-links{display:flex;flex-wrap:wrap;gap:4px;margin:0;padding:0;list-style:none}
.sitenav-links a{display:block;padding:7px 12px;border-radius:999px;font-size:13.5px;font-weight:500;color:var(--muted);text-decoration:none;white-space:nowrap}
.sitenav-links a:hover{color:var(--ink);background:color-mix(in srgb,var(--line) 45%,transparent)}
.sitenav-links a[aria-current=page]{color:var(--panel);background:var(--steel);font-weight:700}
@media (max-width:520px){.sitenav-brand{margin-right:0;width:100%;padding:12px 0 2px}.sitenav-links{padding-bottom:10px}.sitenav-links a{padding:6px 9px;font-size:12.5px}}

/* 머리말 */
.head{max-width:1400px;margin:0 auto;padding:20px 16px 8px}
.head h1{font-family:var(--display);font-weight:400;font-size:28px;margin:0;letter-spacing:.5px}
.head h1 b{color:var(--gold);font-weight:400}
.steps{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0 0;padding:0;list-style:none}
.steps li{display:flex;align-items:center;gap:8px;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:5px 14px 5px 6px;font-size:13px;color:var(--muted)}
.steps li span{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;background:var(--steel);color:var(--panel);font-weight:700;font-size:12px}

/* 3단 레이아웃 */
.app{max-width:1400px;margin:0 auto;padding:12px 16px 40px;display:grid;grid-template-columns:270px minmax(0,1fr) 330px;gap:14px;align-items:start}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:12px 14px 0}
.card-h h2{font-size:14px;margin:0;font-weight:700}
.muted{color:var(--muted)}

/* 장비 목록 */
.list{position:sticky;top:12px;display:flex;flex-direction:column;max-height:calc(100vh - 24px)}
.cats{display:flex;gap:4px;padding:10px 12px 0;flex-wrap:wrap}
.cats button{border:1px solid var(--line);background:transparent;border-radius:999px;padding:4px 12px;font-size:13px;cursor:pointer;color:var(--muted)}
.cats button[aria-pressed=true]{background:var(--steel);border-color:var(--steel);color:var(--panel);font-weight:700}
.search{margin:10px 12px 8px;position:relative}
.search input{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:9px 12px 9px 34px;outline:none}
.search input:focus{border-color:var(--steel)}
.search svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);width:16px;height:16px;color:var(--muted)}
.items{list-style:none;margin:0;padding:0 6px 8px;overflow:auto;flex:1;min-height:120px}
.items button{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:0;background:transparent;border-radius:8px;padding:5px 10px 5px 6px;cursor:pointer}
.items .ic{width:44px;height:44px;flex:none;display:grid;place-items:center}
.items .ic img{width:44px;height:44px;object-fit:contain}
.items .nm{flex:1;min-width:0;line-height:1.35}
.items .nm small{display:block;font-size:11.5px;color:var(--muted);font-weight:400}
.items .grp{list-style:none;font-size:12px;font-weight:700;color:var(--muted);padding:10px 10px 4px}
.items button:hover{background:var(--panel-2)}
.items button[aria-selected=true]{background:var(--gold-soft);font-weight:700}
.items .code{font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums;flex:none}
.count{font-size:12px;color:var(--muted);padding:0 14px 10px}

/* 뷰어 */
.viewer{overflow:hidden}
/* 넓은 화면: 아래쪽 스킨 칸을 보면서도 3D가 화면에 남도록 */
@media (min-width:1101px){.viewer{position:sticky;top:12px}}
.stage{position:relative;aspect-ratio:4/3.2;background:var(--stage);border-radius:12px 12px 0 0;touch-action:none}
.stage canvas{display:block;width:100%;height:100%;border-radius:12px 12px 0 0;cursor:grab}
.stage canvas:active{cursor:grabbing}
.stage-msg{position:absolute;inset:0;display:grid;place-items:center;text-align:center;padding:24px;color:var(--muted);pointer-events:none}
.stage-title{position:absolute;left:14px;top:12px;pointer-events:none;display:flex;align-items:center;gap:10px}
.stage-title img{width:52px;height:52px}
.stage-title b{display:block;font-family:var(--display);font-weight:400;font-size:20px;letter-spacing:.3px}
.stage-title span{font-size:12px;color:var(--muted)}
.hint{position:absolute;right:12px;bottom:10px;font-size:11.5px;color:var(--muted);pointer-events:none;background:color-mix(in srgb,var(--panel) 70%,transparent);padding:2px 8px;border-radius:6px}
.toolbar{display:flex;flex-wrap:wrap;gap:6px;padding:10px 12px;border-top:1px solid var(--line);align-items:center}
.tb{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:6px 11px;font-size:13px;cursor:pointer;white-space:nowrap}
.tb:hover{border-color:var(--steel)}
.tb[aria-pressed=true]{background:var(--steel);border-color:var(--steel);color:var(--panel);font-weight:700}
.tb svg{width:15px;height:15px}
.tb-sep{flex:1}
.seg{display:inline-flex}
.seg .tb:first-child{border-radius:8px 0 0 8px}
.seg .tb:last-child{border-radius:0 8px 8px 0;margin-left:-1px}
.variants{display:flex;gap:6px;flex-wrap:wrap;padding:0 12px 10px}
.variants:empty{display:none}

/* 스킨 패널 */
.skin{position:sticky;top:12px}
.skin-body{padding:10px 14px 14px;display:flex;flex-direction:column;gap:12px}
.slot{border:1px solid var(--line);border-radius:10px;overflow:hidden}
.drop{position:relative;display:block;aspect-ratio:1;background:repeating-conic-gradient(var(--panel-2) 0 25%,var(--panel) 0 50%) 0 0/16px 16px;cursor:pointer}
.drop img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;image-rendering:auto}
.drop canvas.uv{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;pointer-events:none}
/* 마우스를 올려도 텍스처·UV 선이 가려지지 않게 아래 띠로만 안내 (끌어다 놓을 때만 전체 덮기) */
.drop .over{position:absolute;left:0;right:0;bottom:0;display:grid;place-items:center;background:color-mix(in srgb,var(--steel) 85%,transparent);color:#fff;font-weight:700;font-size:12.5px;opacity:0;transition:opacity .15s;text-align:center;padding:7px 10px}
.drop .over br{display:none}
.drop:hover .over{opacity:1}
.drop.dragging .over{opacity:1;top:0;font-size:14px}
.drop.dragging .over br{display:inline}
.slot{transition:border-color .15s,box-shadow .15s}
.slot.hl{border-color:var(--steel)}
.slot.pinned{border-color:var(--gold);box-shadow:0 0 0 2px var(--gold-soft)}
.loc{display:inline-flex;align-items:center;gap:4px;border:1px solid var(--line);background:var(--panel);border-radius:6px;padding:2px 8px;font-size:12px;cursor:pointer;color:var(--muted)}
.loc:hover{border-color:var(--steel);color:var(--ink)}
.loc[aria-pressed=true]{background:var(--gold);border-color:var(--gold);color:var(--panel);font-weight:700}
.loc svg{width:13px;height:13px}
.slot-title .r{display:flex;align-items:center;gap:6px}
#slots[data-hl=off] .loc{display:none}

/* 스킨 도구 */
.skin-tools{margin:10px 14px 0;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);display:flex;flex-direction:column;gap:8px}
.tool-row{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.tool-row > span{font-size:12.5px;font-weight:700}
.skin-tools .tb{padding:4px 9px;font-size:12.5px}
.swatches{display:inline-flex;gap:5px;align-items:center}
.swatches button{width:18px;height:18px;border-radius:50%;border:2px solid var(--panel);box-shadow:0 0 0 1px var(--line);cursor:pointer;padding:0}
.swatches button[aria-pressed=true]{box-shadow:0 0 0 2px var(--ink)}
.swatches[aria-disabled=true]{opacity:.35;pointer-events:none}
.tool-tip{font-size:11.5px;color:var(--muted);margin:0;line-height:1.45}
.hl-tag{position:absolute;right:12px;top:12px;display:flex;align-items:center;gap:6px;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:4px 12px 4px 8px;font-size:12.5px;font-weight:700;box-shadow:0 2px 8px rgb(0 0 0/.08);pointer-events:none}
.hl-tag i{width:9px;height:9px;border-radius:50%;background:var(--gold);flex:none}
.hl-tag.none i{background:var(--muted)}
.hl-tag.none{font-weight:500;color:var(--muted)}
@media (max-width:760px){.hl-tag{top:auto;bottom:10px;right:10px}}
.slot-info{padding:10px 12px;display:flex;flex-direction:column;gap:8px}
.slot-row{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.badge{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:700;border-radius:6px;padding:2px 8px;background:var(--panel-2);font-variant-numeric:tabular-nums}
.badge.size{background:var(--gold-soft);color:var(--gold)}
.badge.mine{background:color-mix(in srgb,var(--ok) 18%,transparent);color:var(--ok)}
.fname{font-size:12px;color:var(--muted);word-break:break-all}
.slot-title{display:flex;align-items:center;justify-content:space-between;gap:8px}
.slot-title b{font-size:14px}
.slot-title b small{font-weight:500;color:var(--muted);font-size:12px;margin-left:4px}
.fxnote{font-size:12px;color:var(--muted);background:var(--panel-2);border-radius:6px;padding:6px 8px}
.btns{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.btn{display:inline-flex;justify-content:center;align-items:center;gap:6px;border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:8px 6px;font-size:12.5px;cursor:pointer;text-align:center}
.btn:hover{border-color:var(--steel)}
.btn.primary{grid-column:1/-1;background:var(--steel);border-color:var(--steel);color:var(--panel);font-weight:700;font-size:13.5px;padding:10px}
.btn.primary:hover{filter:brightness(1.1)}
.btn svg{width:14px;height:14px;flex:none}
.err{display:flex;gap:8px;align-items:flex-start;background:color-mix(in srgb,var(--warn) 12%,transparent);border:1px solid color-mix(in srgb,var(--warn) 40%,transparent);color:var(--warn);border-radius:8px;padding:9px 10px;font-size:12.5px;font-weight:500}
.err svg{width:16px;height:16px;flex:none;margin-top:2px}
.rules{font-size:12px;color:var(--muted);margin:0;padding-left:18px}
.rules b{color:var(--ink)}
.empty{padding:22px 14px;color:var(--muted);text-align:center}

/* 반응형 */
@media (max-width:1100px){
  .app{grid-template-columns:240px minmax(0,1fr)}
  .skin{grid-column:1/-1;position:static}
  .skin-body{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr))}
}
@media (max-width:760px){
  .app{grid-template-columns:minmax(0,1fr)}
  .list{position:static;max-height:none}
  .items{max-height:230px}
  .viewer{order:-1}
  .stage{aspect-ratio:1/1}
  .head h1{font-size:23px}
  .hint{display:none}
}
</style>
</head>
<body>
<nav class="sitenav" aria-label="사이트 메뉴" data-noexport><div class="sitenav-in" style="max-width:1400px"><a class="sitenav-brand" href="index.html">LOSTSAGA <b>공략</b></a><ul class="sitenav-links"><li><a href="index.html">용병 / 장비 라인업</a></li><li><a href="skill_dictionary.html">장비·기술 수치 사전</a></li><li><a href="pet_medal.html">펫 / 메달</a></li><li><a href="geardesign.html" aria-current=page>장비 스킨 제작</a></li></ul></div></nav>

<header class="head">
  <h1>장비 스킨 <b>제작</b></h1>
  <ol class="steps">
    <li><span>1</span>장비 고르기</li>
    <li><span>2</span>원본 텍스처 · UV 가이드 받아서 그리기</li>
    <li><span>3</span>JPG 올려서 3D로 확인</li>
  </ol>
</header>

<main class="app">
  <!-- 장비 목록 -->
  <section class="card list" aria-label="장비 목록">
    <div class="card-h"><h2>장비 선택</h2></div>
    <div class="cats" id="cats" role="group" aria-label="분류"></div>
    <label class="search">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="q" type="search" placeholder="장비·용병 이름, 단축어 (예: 릴리모, 퓨리갑)" autocomplete="off" aria-label="장비 검색">
    </label>
    <ul class="items" id="items" role="listbox" aria-label="장비"></ul>
    <div class="count" id="count"></div>
  </section>

  <!-- 3D 뷰어 -->
  <section class="card viewer" aria-label="3D 미리보기">
    <div class="stage" id="stage">
      <div class="stage-title" id="stitle" hidden><img id="sicon" alt="" hidden><div><b id="sname"></b><span id="scode"></span></div></div>
      <div class="stage-msg" id="smsg">장비 목록을 불러오는 중…</div>
      <div class="hint">드래그: 회전 · 휠/두 손가락: 확대 · 우클릭 드래그: 이동</div>
      <div class="hl-tag" id="hlTag" hidden><i></i><span></span></div>
    </div>
    <div class="toolbar">
      <div class="seg" role="group" aria-label="치장 성별">
        <button class="tb" id="gM" aria-pressed="true">남성</button><button class="tb" id="gW" aria-pressed="false">여성</button>
      </div>
      <button class="tb" id="tChar" aria-pressed="false" title="캐릭터가 들고 있는 모습으로 보기">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="5" r="3"/><path d="M5 11h14M12 8v7m0 0-4 6m4-6 4 6"/></svg>캐릭터 착용</button>
      <button class="tb" id="tSpin" aria-pressed="true" title="자동 회전">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 12a9 9 0 1 1-3-6.7"/><path d="M21 3v6h-6"/></svg>자동 회전</button>
      <button class="tb" id="tOutline" aria-pressed="true" title="게임처럼 외곽선 표시">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="4" width="16" height="16" rx="3"/></svg>외곽선</button>
      <button class="tb" id="tFx" aria-pressed="true" title="빛나는 효과(이펙트) 표시">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M12 3l2.2 5.8L20 11l-5.8 2.2L12 19l-2.2-5.8L4 11l5.8-2.2z"/></svg>이펙트</button>
      <button class="tb" id="tWire" aria-pressed="false" title="폴리곤 선 보기">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M12 3 3 8v8l9 5 9-5V8z"/><path d="M3 8l9 5 9-5M12 13v8"/></svg>와이어</button>
      <span class="tb-sep"></span>
      <button class="tb" id="tReset" title="시점 초기화">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 3v6h6"/></svg>초기화</button>
      <button class="tb" id="tShot" title="현재 화면을 PNG로 저장">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>스크린샷</button>
    </div>
    <div class="variants" id="variants"></div>
  </section>

  <!-- 스킨 패널 -->
  <section class="card skin" aria-label="스킨">
    <div class="card-h"><h2>스킨 텍스처</h2><span class="muted" id="slotCount" style="font-size:12px"></span></div>
    <div class="skin-tools">
      <div class="tool-row">
        <span>3D에서 파츠 위치</span>
        <div class="seg" id="hlMode" role="group" aria-label="파츠 위치 표시 방식">
          <button class="tb" data-m="ghost" title="나머지 부분을 반투명하게">나머지 흐리게</button><button class="tb" data-m="solo" title="그 파츠만 보이게" style="margin-left:-1px;border-radius:0">그 파츠만</button><button class="tb" data-m="off" title="위치 표시 끄기">끔</button>
        </div>
      </div>
      <div class="tool-row">
        <button class="tb" id="uvOn" aria-pressed="false" title="텍스처 위에 UV 선을 겹쳐서 보기">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M4 4h16v16H4z"/><path d="M4 14l6-6 4 4 6-6M10 20l4-8"/></svg>UV 선 겹쳐 보기</button>
        <div class="swatches" id="uvColors" role="group" aria-label="UV 선 색"></div>
      </div>
      <p class="tool-tip" id="hlTip"></p>
    </div>
    <div class="skin-body" id="slots"><div class="empty">장비를 고르면 여기에 텍스처가 나와요.</div></div>
  </section>
</main>

<template id="slotTpl">
  <div class="slot">
    <label class="drop">
      <img alt="">
      <span class="over">JPG를 끌어다 놓거나<br>눌러서 고르기</span>
      <input type="file" accept=".jpg,.jpeg,image/jpeg" hidden>
    </label>
    <div class="slot-info">

<script type="importmap">

<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const DATA = 'geardesign_data/';
const $ = s => document.querySelector(s);
const state = { db:null, cat:null, item:null, variant:0, showChar:false, outline:true, wire:false, fx:true, gender:'m',
                custom:{} /* tex → {url, texture, w, h} — 장비를 바꿔도 유지 */,
                hl: pref('gd.hl', 'ghost'),            // 파츠 위치 표시: ghost(나머지 흐리게) / solo(그 파츠만) / off
                uv: pref('gd.uv', '0') === '1', uvColor: pref('gd.uvc', '#e0245e'),
                hover:null, pin:null /* 위치를 보여 줄 텍스처 이름 */ };
// 보기 설정 기억 (저장소가 막혀 있으면 기본값)
function pref(k, d){ try { return localStorage.getItem(k) ?? d; } catch { return d; } }

/* ───────── 3D 기본 ───────── */
const stage = $('#stage');
const renderer = new THREE.WebGLRenderer({ antialias:true, alpha:true, preserveDrawingBuffer:true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.outputColorSpace = THREE.SRGBColorSpace;
stage.prepend(renderer.domElement);
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(35, 1, 1, 5000);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true; controls.autoRotate = true; controls.autoRotateSpeed = 1.6;
scene.add(new THREE.HemisphereLight(0xffffff, 0x8a8f99, 1.15));
const sun = new THREE.DirectionalLight(0xffffff, 1.6); sun.position.set(1, 2, 1.5); camera.add(sun); scene.add(camera);
const root = new THREE.Group(); scene.add(root);
const itemGroup = new THREE.Group(), charGroup = new THREE.Group();
root.add(itemGroup, charGroup);

// 3단 툰 그라데이션
const toonRamp = (() => { const d = new Uint8Array([110,110,110,255, 190,190,190,255, 255,255,255,255]);
  const t = new THREE.DataTexture(d, 3, 1); t.minFilter = t.magFilter = THREE.NearestFilter; t.needsUpdate = true; return t; })();

// 배경을 캔버스에 직접 칠해야 빛 효과(가산 혼합)가 제대로 보임
function syncBg(){ renderer.setClearColor(new THREE.Color(getComputedStyle(stage).backgroundColor), 1); }
syncBg(); matchMedia('(prefers-color-scheme: dark)').addEventListener('change', syncBg);
function resize(){ const r = stage.getBoundingClientRect(); renderer.setSize(r.width, r.height, false);
  camera.aspect = r.width / r.height; camera.updateProjectionMatrix(); }
new ResizeObserver(resize).observe(stage); resize();
const clock = new THREE.Clock();
renderer.setAnimationLoop(() => {
  const t = clock.getElapsedTime();
  for (const m of pulseMats) m.opacity = (0.75 + 0.25 * Math.sin(t * 3)) * (m.userData.dim ?? 1);
  if (hlMats.length){ const k = 0.16 + 0.12 * Math.sin(t * 4.5); for (const m of hlMats) m.emissive.setRGB(k, k * 0.72, k * 0.15); }
  controls.update(); renderer.render(scene, camera);
});

/* ───────── 데이터 ───────── */
const gltf = new GLTFLoader(), texLoader = new THREE.TextureLoader();
const meshCache = new Map(), texCache = new Map();
const loadGLB = f => { if (!meshCache.has(f)) meshCache.set(f, gltf.loadAsync(DATA + f)); return meshCache.get(f); };
function prepTex(t){ t.flipY = false; t.colorSpace = THREE.SRGBColorSpace; t.wrapS = t.wrapT = THREE.RepeatWrapping; t.anisotropy = 4; return t; }
const loadTex = f => { if (!texCache.has(f)) texCache.set(f, texLoader.loadAsync(DATA + f).then(prepTex)); return texCache.get(f); };

const pulseMats = [];
const texUsers = new Map(); // tex 이름 → 그 텍스처를 쓰는 재질들 (스킨 교체용)

// 맨살 재질: 텍스처 알파만큼 텍스처, 나머지는 피부색 (게임의 blend_texture_alpha + tfactor)
const skinTexCache = new Map();
function skinTexture(orig, skin){
  if (!orig?.image) return null;
  const key = orig.uuid; if (skinTexCache.has(key)) return skinTexCache.get(key);
  const im = orig.image, cv = document.createElement('canvas'); cv.width = im.width; cv.height = im.height;
  const c = cv.getContext('2d'); c.fillStyle = `rgb(${skin.map(v => Math.round(v * 255)).join(',')})`;
  c.fillRect(0, 0, cv.width, cv.height); c.drawImage(im, 0, 0);
  const t = prepTex(new THREE.CanvasTexture(cv)); skinTexCache.set(key, t); return t;
}
// 가산(빛) 텍스처 → 밝기를 알파로 바꾼 텍스처. 검정 = 완전 투명, 색은 그대로 유지
const glowCache = new Map();
function glowTexture(t){
  const im = t?.image; if (!im || !im.width) return t;
  if (glowCache.has(t.uuid)) return glowCache.get(t.uuid);
  const cv = document.createElement('canvas'); cv.width = im.width; cv.height = im.height;
  const c = cv.getContext('2d', { willReadFrequently:true }); c.drawImage(im, 0, 0);
  const d = c.getImageData(0, 0, cv.width, cv.height), p = d.data;
  for (let i = 0; i < p.length; i += 4){
    const m = Math.max(p[i], p[i+1], p[i+2]);
    if (m === 0){ p[i+3] = 0; continue; }
    const k = 255 / m;
    p[i] = Math.min(255, p[i] * k); p[i+1] = Math.min(255, p[i+1] * k); p[i+2] = Math.min(255, p[i+2] * k);
    p[i+3] = Math.round(m * p[i+3] / 255);
  }
  c.putImageData(d, 0, 0);
  const g = prepTex(new THREE.CanvasTexture(cv)); glowCache.set(t.uuid, g); return g;
}
const SKIN = () => state.db?.character?.skin || [0.95, 0.82, 0.56];

async function buildModel(file, mats){
  const g = (await loadGLB(file)).scene.clone(true);
  const meshes = []; g.traverse(o => o.isMesh && meshes.push(o));
  for (const o of meshes){
    const idx = parseInt((o.material.name || 'm0').slice(1)) || 0;
    const info = mats[idx] || {};
    let mat;
    const orig = info.texFile ? await loadTex(info.texFile).catch(() => null) : null;
    const map = (info.tex && state.custom[info.tex]?.texture) || orig;
    if (info.blend === 'add'){
      const e = info.emissive || [1,1,1];
      // 빛 효과: 게임은 검은 배경 위에 더하는 방식(가산)이라 밝은 배경에선 색이 바래거나 어둡게 보임
      // → 밝기를 투명도로 바꾼 텍스처로 일반 합성 (검은 부분은 투명, 빨간 빔은 빨갛게)
      mat = new THREE.MeshBasicMaterial({ map: glowTexture(map), color:new THREE.Color(Math.max(e[0],.35), Math.max(e[1],.35), Math.max(e[2],.35)),
        transparent:true, depthWrite:false, side:THREE.DoubleSide });
      mat.userData.glow = true;
      pulseMats.push(mat); o.userData.fx = true; o.visible = state.fx;
    } else {
      const isSkin = !!info.skin;
      mat = new THREE.MeshToonMaterial({ map: isSkin ? skinTexture(orig, SKIN()) : map, gradientMap:toonRamp,
        color: isSkin && !orig ? new THREE.Color(...SKIN()) : 0xffffff, side: info.doubleSide ? THREE.DoubleSide : THREE.FrontSide });
      // 게임은 alpha_test 가 있는 재질만 투명 부분을 잘라냄 (텍스처에 알파가 있어도 보통은 불투명)
      if (!isSkin && info.cutout && info.blend !== 'alpha') mat.alphaTest = 0.5;
      if (info.blend === 'alpha'){ mat.transparent = true; mat.depthWrite = false; }
      if (info.blend === 'mul'){ mat.transparent = true; mat.depthWrite = false; mat.blending = THREE.MultiplyBlending; mat.premultipliedAlpha = true; }
      if (info.outline) addOutline(o, info);
    }
    if (!info.skin && info.tex){ if (!texUsers.has(info.tex)) texUsers.set(info.tex, { orig, mats:[] }); texUsers.get(info.tex).mats.push(mat); }
    o.userData.tex = info.skin ? null : info.tex;   // 파츠 위치 표시용
    mat.wireframe = state.wire;
    o.material = mat;
  }

}

// 게임식 외곽선: 뒷면을 법선 방향으로 부풀려 그리기
const outlineMats = [];
function addOutline(mesh, info){
  const w = (info.outlineWidth || 1) * 0.32;
  const mat = new THREE.ShaderMaterial({
    uniforms:{ c:{ value:new THREE.Color(...info.outline) }, w:{ value:w } },
    vertexShader:'uniform float w; void main(){ vec3 p = position + normal * w; gl_Position = projectionMatrix * modelViewMatrix * vec4(p,1.); }',
    fragmentShader:'uniform vec3 c; void main(){ gl_FragColor = vec4(c,1.); }',
    side:THREE.BackSide });
  const ol = new THREE.Mesh(mesh.geometry, mat); ol.visible = state.outline; ol.userData.outline = true;
  outlineMats.push(ol); mesh.add(ol);
}

/* ───────── 목록 UI ───────── */
async function init(){
  try {
    const r = await fetch(DATA + 'items.json', { cache:'no-cache' });
    if (!r.ok) throw new Error(r.status);
    state.db = await r.json();
  } catch(e){
    $('#smsg').innerHTML = location.protocol === 'file:'
      ? '파일을 더블클릭해서 열면 데이터를 못 불러와요.<br>GitHub Pages 주소로 열어 주세요.'
      : '장비 데이터를 불러오지 못했어요.<br><small>geardesign_data 폴더가 같이 올라갔는지 확인해 주세요.</small>';
    return;
  }
  const cats = [...new Set(state.db.items.map(i => i.cat))].sort((a, b) => CAT_ORDER[a] - CAT_ORDER[b]);
  const catBox = $('#cats');
  for (const c of cats){
    const b = document.createElement('button'); b.textContent = state.db.categories[c] || c; b.dataset.cat = c;
    b.onclick = () => { state.cat = c; $('#q').value = ''; renderCats(); renderList(); };
    catBox.append(b);
  }
  if (cats.length < 2) catBox.hidden = true;
  const want = parseInt(location.hash.slice(1));
  const first = state.db.items.find(i => i.code === want) || state.db.items[0];
  state.cat = first?.cat ?? cats[0];
  renderCats(); renderList();
  if (first) selectItem(first); else $('#smsg').textContent = '변환된 장비가 없어요.';
}
function renderCats(){ for (const b of $('#cats').children) b.setAttribute('aria-pressed', b.dataset.cat === state.cat); }
/* ───────── 검색: 장비 이름 · 코드 · 용병 이름 · 단축어 ─────────
   단축어 규칙은 수치 사전(skill_dictionary.html)과 같음: 수동 표(MANUAL) → 장비 이름 기반 → 용병 이름 기반
   예) 릴리모 = 릴리 투구, 퓨리갑 = 퓨리어스 갑옷, 얼신무 = 얼음신 무기 */
const CAT_KO = { weapon:'무기', armor:'갑옷', helmet:'투구', cloak:'망토' };
const CAT_ORDER = { weapon:0, armor:1, helmet:2, cloak:3 };
const SLOTCH = {'무기':['무'],'갑옷':['갑','의상'],'투구':['모','투'],'망토':['망']};
const SLOTWORD = /\s*(갑옷|의상|슈트|아머|투구|모자|서클릿|헬멧|머리장식|머리띠|두건|가면|마스크|고글|복면|터번|망토|장신구|날개|무기)$/;
const nz = s => String(s||'').replace(/\s+/g,'').toLowerCase();
const base = s => String(s||'').replace(/^(\d차|궁극)\s*/,'').replace(/^고급\s*/,'').trim();
let ALIAS = null;
function buildAliases(){
  ALIAS = [new Map(), new Map(), new Map()];   // 0 수동, 1 장비 이름, 2 용병 이름
  const add = (t, a, code) => { a = nz(a); if (!a) return; const M = ALIAS[t]; if (!M.has(a)) M.set(a, new Set()); M.get(a).add(code); };
  const items = state.db.items;
  for (const [a, nm] of Object.entries(state.db.aliases || {})){
    const n = nz(base(nm)).replace(/의/g,'');
    for (const it of items) for (const nm2 of [it.name, ...(it.aka || [])]){ const t = nz(base(nm2)).replace(/의/g,''); if (t.includes(n)) add(0, a, it.code); }
  }
  for (const it of items){
    const chs = SLOTCH[CAT_KO[it.cat]] || [];
    const mk = (st0, t) => { const st = nz(st0); if (!st) return;
      for (const c of chs){ add(t, st.slice(0,2)+c, it.code); add(t, st[0]+st[st.length-1]+c, it.code); add(t, st+c, it.code);
        if (st.length >= 3) add(t, st.slice(0,3)+c, it.code); } };
    for (const nm2 of [it.name, ...(it.aka || [])]) mk(base(nm2).replace(SLOTWORD,'').replace(/의$/,'').trim(), 1);
    if (it.merc) mk(it.merc, 2);
  }
}
function matches(q){
  const nq = nz(q); if (!nq) return null;
  if (!ALIAS) buildAliases();
  const hit = new Set();
  // 수치 사전과 같은 우선순위: 수동 단축어 → 장비 이름 규칙 → 용병 이름 규칙 중 먼저 걸리는 것 하나만
  for (const M of ALIAS) if (M.has(nq)){ M.get(nq).forEach(c => hit.add(c)); break; }
  for (const it of state.db.items)
    if ([it.name, ...(it.aka || [])].some(n => nz(n).includes(nq)) || nz(it.merc).includes(nq) || String(it.code).includes(nq)) hit.add(it.code);
  return hit;
}
function renderList(){
  const q = $('#q').value.trim();
  const ul = $('#items'); ul.textContent = '';
  const hit = matches(q);
  let list = state.db.items.filter(i => hit ? hit.has(i.code) : i.cat === state.cat);
  if (hit) list.sort((a, b) => (CAT_ORDER[a.cat] - CAT_ORDER[b.cat]) || (a.code - b.code));
  $('#cats').style.opacity = hit ? .45 : 1;
  const frag = document.createDocumentFragment();
  let lastCat = null;
  for (const it of list){
    if (hit && it.cat !== lastCat){ const h = document.createElement('li'); h.className = 'grp'; h.textContent = CAT_KO[it.cat] || it.cat; frag.append(h); lastCat = it.cat; }
    const li = document.createElement('li'), b = document.createElement('button');
    b.setAttribute('role','option'); b.setAttribute('aria-selected', it === state.item);
    b.dataset.code = it.code;
    b.innerHTML = `<span class="ic">${iconSrc(it) ? `<img loading="lazy" alt="" src="${iconSrc(it)}">` : ''}</span><span class="nm"><span></span><small></small></span>`;
    b.querySelector('.nm span').textContent = it.name;
    b.querySelector('.nm small').textContent = it.merc || gradeOf(it);
    b.onclick = () => selectItem(it);
    li.append(b); frag.append(li);
  }
  ul.append(frag);
  $('#count').textContent = list.length ? `${list.length}개` : '검색 결과가 없어요';
}
$('#q').addEventListener('input', renderList);

/* ───────── 장비 선택 ───────── */
let loadToken = 0;
async function selectItem(it, variant = 0){
  state.item = it; state.variant = variant; state.hover = state.pin = null;
  history.replaceState(null, '', '#' + it.code);
  for (const b of $('#items').querySelectorAll('button')) b.setAttribute('aria-selected', b.dataset.code == it.code);
  $('#stitle').hidden = false; $('#sname').textContent = it.name;
  $('#sicon').hidden = !iconSrc(it); if (iconSrc(it)) $('#sicon').src = iconSrc(it);
  $('#scode').textContent = [state.db.categories[it.cat], it.merc || gradeOf(it),
    it.female ? (state.gender === 'w' ? '여성용' : '남성용') : (it.cat === 'weapon' ? '' : '남녀 공용')].filter(Boolean).join(' · ');
  $('#smsg').textContent = '불러오는 중…'; $('#smsg').hidden = false;
  renderVariants(); renderSlots();
  const token = ++loadToken;
  try {
    const v = cur(it).variants[variant] || cur(it).variants[0];
    texUsers.clear(); pulseMats.length = 0; outlineMats.length = 0;
    const gs = await Promise.all(partsOf(v).map(p => buildModel(p.file, p.materials)));
    if (token !== loadToken) return;
    itemGroup.clear(); gs.forEach(g => itemGroup.add(g));
    if (state.showChar) await ensureChar();
    syncCharParts(); applyHighlight();
    $('#smsg').hidden = true;
    frame(true);
  } catch(e){ console.error(e); if (token === loadToken) $('#smsg').textContent = '모델을 불러오지 못했어요.'; }
}
function renderVariants(){
  const box = $('#variants'); box.textContent = '';
  const vs = cur(state.item).variants; if (vs.length < 2) return;
  vs.forEach((v, i) => { const b = document.createElement('button'); b.className = 'tb';
    b.textContent = `모양 ${i + 1}`; b.title = partsOf(v).map(p => p.mesh).join(', '); b.setAttribute('aria-pressed', i === state.variant);
    b.onclick = () => selectItem(state.item, i); box.append(b); });
}

/* ───────── 캐릭터 ───────── */
const charReady = {};
function ensureChar(){
  const gd = state.gender, ch = (gd === 'w' && state.db.characterW) || state.db.character;
  if (!ch) return Promise.resolve();
  if (!charReady[gd]) charReady[gd] = Promise.all(ch.parts.map(async p => {
      const g = await buildModel(p.file, p.materials.map(m => ({ ...m, skin:true })));
      g.userData.part = /body/.test(p.mesh) ? 'body' : /hand/.test(p.mesh) ? 'hand' : /face|head/.test(p.mesh) ? 'face' : 'etc';
      g.userData.gender = gd;
      return g; })).then(gs => gs.forEach(g => charGroup.add(g)));
  return charReady[gd];
}
// 갑옷을 보고 있으면 마네킹의 몸/손은 숨기고 갑옷 몸/손으로 대신
function syncCharParts(){
  const v = cur(state.item).variants[state.variant] || cur(state.item).variants[0];
  const roles = new Set(partsOf(v).map(p => p.role));
  for (const g of charGroup.children) g.visible = g.userData.gender === state.gender && !roles.has(g.userData.part);
}
$('#tChar').onclick = async e => {
  if (!state.db?.character){ toast('캐릭터 모델이 아직 변환되지 않았어요.'); return; }
  state.showChar = !state.showChar; e.currentTarget.setAttribute('aria-pressed', state.showChar);
  if (state.showChar){ await ensureChar(); syncCharParts(); }
  charGroup.visible = state.showChar; applyHighlight(); frame(true);
};
charGroup.visible = false;

/* ───────── 카메라 맞추기 ───────── */
function frame(reset){
  root.position.set(0,0,0); root.updateMatrixWorld(true);
  const box = new THREE.Box3().setFromObject(state.showChar ? root : itemGroup);
  if (box.isEmpty()) return;
  const c = box.getCenter(new THREE.Vector3()), s = box.getSize(new THREE.Vector3());
  root.position.copy(c).negate();
  const r = Math.max(s.x, s.y, s.z) * 0.62 || 50;
  if (reset){
    const d = r / Math.sin(THREE.MathUtils.degToRad(camera.fov / 2)) * 0.95;
    // 캐릭터: 정면 사선 / 장비만: 가장 얇은 축 방향(넓은 면)에서 보기
    let dir = new THREE.Vector3(0, 0.12, 1);   // 캐릭터: 게임 미리보기처럼 정면
    if (!state.showChar){
      const ax = s.x <= s.y && s.x <= s.z ? 'x' : (s.y <= s.z ? 'y' : 'z');
      dir = new THREE.Vector3(0.25, 0.2, 0.25); dir[ax] = 1;
      if (ax === 'y') dir.set(0.25, 1, 0.45);
    }
    camera.position.copy(dir.normalize().multiplyScalar(d)); camera.near = d / 100; camera.far = d * 20; camera.updateProjectionMatrix();
    controls.target.set(0,0,0); controls.minDistance = r * 0.3; controls.maxDistance = d * 4;
  }
}

/* ───────── 툴바 ───────── */
function toggle(id, key, fn){ $(id).onclick = e => { state[key] = !state[key]; e.currentTarget.setAttribute('aria-pressed', state[key]); fn(state[key]); }; }
state.spin = true;
toggle('#tSpin', 'spin', v => controls.autoRotate = v);
toggle('#tOutline', 'outline', () => applyHighlight());
toggle('#tFx', 'fx', () => applyHighlight());
toggle('#tWire', 'wire', v => root.traverse(o => { if (o.isMesh && !o.userData.outline) o.material.wireframe = v; }));
$('#tReset').onclick = () => frame(true);
for (const [id, g] of [['#gM','m'], ['#gW','w']]) $(id).onclick = () => {
  if (state.gender === g) return;
  state.gender = g; $('#gM').setAttribute('aria-pressed', g === 'm'); $('#gW').setAttribute('aria-pressed', g === 'w');
  if (state.item) selectItem(state.item, 0);
};
$('#tShot').onclick = () => download(renderer.domElement.toDataURL('image/png'), `${state.item?.name || 'gear'}_미리보기.png`);

/* ───────── 파츠 위치 표시 ─────────
   스킨 칸에 마우스를 올리거나 '위치'를 눌러 고정하면, 그 텍스처를 쓰는 메시만 강조
   ghost: 나머지를 반투명하게 + 해당 파츠를 은은하게 깜빡임 / solo: 해당 파츠만 보이기 */
const hlMats = [];
const HL_MODES = { ghost:'나머지 흐리게', solo:'그 파츠만', off:'끔' };
function applyHighlight(){
  const tex = state.hover ?? state.pin, on = !!tex && state.hl !== 'off';
  for (const m of hlMats) m.emissive.setRGB(0, 0, 0);
  hlMats.length = 0;
  let found = 0;
  root.traverse(o => {
    if (!o.isMesh || o.userData.outline) return;
    const m = o.material, hit = on && o.userData.tex === tex, dim = on && !hit && state.hl === 'ghost';
    if (hit) found++;
    // 먼저 원래대로
    if (m.userData.hlSave){ Object.assign(m, m.userData.hlSave); delete m.userData.hlSave; m.needsUpdate = true; }
    m.userData.dim = 1;
    o.visible = on && state.hl === 'solo' ? hit : (hit || !o.userData.fx || state.fx);
    for (const c of o.children) if (c.userData.outline) c.visible = state.outline && !dim;
    if (dim){
      if (m.userData.glow) m.userData.dim = 0.12;
      else { m.userData.hlSave = { transparent:m.transparent, opacity:m.opacity, depthWrite:m.depthWrite };
             m.transparent = true; m.opacity = 0.13; m.depthWrite = false; m.needsUpdate = true; }
    }
    if (hit && state.hl === 'ghost' && m.emissive) hlMats.push(m);
  });
  // 위치 표시 중 안내 (지금 모양에 그 텍스처가 없으면 알려 줌)
  const tag = $('#hlTag');
  tag.hidden = !on;
  if (on){
    const s = cur(state.item).slots.find(x => x.tex === tex);
    tag.classList.toggle('none', !found);
    tag.querySelector('span').textContent = !found ? `${slotLabel(s)} · 지금 모양에는 안 쓰여요`
      : `${slotLabel(s)} 위치${state.pin === tex && state.hover == null ? ' · 고정' : ''}`;
  }
  for (const el of $('#slots').querySelectorAll('.slot')){
    el.classList.toggle('hl', on && el.dataset.tex === tex);
    el.classList.toggle('pinned', state.pin === el.dataset.tex && state.hl !== 'off');
    el.querySelector('.loc').setAttribute('aria-pressed', state.pin === el.dataset.tex);
  }
}
function slotLabel(s){
  if (!s) return '이 스킨';
  const slots = cur(state.item).slots;
  return `스킨 ${s.no || (slots.indexOf(s) + 1)}`;
}
function renderHlMode(){
  for (const b of $('#hlMode').children) b.setAttribute('aria-pressed', b.dataset.m === state.hl);
  $('#slots').dataset.hl = state.hl;
  $('#hlTip').textContent = state.hl === 'off'
    ? '파츠 위치 표시가 꺼져 있어요.'
    : '스킨 칸에 마우스를 올리면 왼쪽 3D에서 그 파츠 위치를 보여 줘요. ‘위치’를 누르면 계속 표시돼요.';
}
for (const b of $('#hlMode').children) b.onclick = () => {
  state.hl = b.dataset.m; savePref('gd.hl', state.hl); renderHlMode(); applyHighlight();
};

/* ───────── UV 선 겹쳐 보기 ───────── */
const UV_COLORS = [['#e0245e','분홍'], ['#ffd400','노랑'], ['#00c2d1','청록'], ['#ffffff','흰색'], ['#111111','검정']];
const uvCache = new Map();   // 장비·성별·텍스처 → 그 텍스처를 쓰는 메시들의 {uv, index}
async function uvMeshes(s){
  const key = `${state.item.code}|${state.gender}|${s.tex}`;
  if (uvCache.has(key)) return uvCache.get(key);
  const out = [];
  for (const v of cur(state.item).variants) for (const p of partsOf(v)){
    const g = (await loadGLB(p.file)).scene; const meshes = []; g.traverse(o => o.isMesh && meshes.push(o));
    for (const o of meshes){
      const idx = parseInt((o.material.name || 'm0').slice(1)) || 0;
      if (p.materials[idx]?.tex !== s.tex) continue;
      const uv = o.geometry.attributes.uv, ix = o.geometry.index; if (uv && ix) out.push({ uv, ix });
    }
  }
  uvCache.set(key, out); return out;
}
// UV 삼각형을 W×H 캔버스에 그리기
function strokeUV(ctx, list, W, H){
  ctx.beginPath();
  for (const { uv, ix } of list)
    for (let i = 0; i < ix.count; i += 3)
      for (let k = 0; k <= 3; k++){
        const n = ix.getX(i + (k % 3)), x = uv.getX(n) * W, y = uv.getY(n) * H;
        k ? ctx.lineTo(x, y) : ctx.moveTo(x, y);
      }
  ctx.stroke();
}
// 스킨 칸 위에 겹치는 UV 선: 화면 크기에 맞춘 해상도로 그려서 선이 또렷하게
async function drawUvOverlay(s, cv){
  if (!state.uv){ cv.hidden = true; return; }
  const box = cv.parentElement.getBoundingClientRect().width || 300;
  const px = Math.round(box * Math.min(devicePixelRatio || 1, 2));
  const k = px / Math.max(s.w, s.h), W = Math.round(s.w * k), H = Math.round(s.h * k);
  const list = await uvMeshes(s);
  cv.width = W; cv.height = H; cv.hidden = false;
  const ctx = cv.getContext('2d'); ctx.clearRect(0, 0, W, H);
  ctx.lineJoin = 'round'; ctx.lineWidth = Math.max(1, px / 320);
  // 어떤 텍스처 위에서도 보이도록 얇은 그림자 선을 먼저
  ctx.strokeStyle = state.uvColor === '#111111' ? 'rgba(255,255,255,.55)' : 'rgba(0,0,0,.45)';
  ctx.lineWidth += 1.2; strokeUV(ctx, list, W, H);
  ctx.strokeStyle = state.uvColor; ctx.lineWidth -= 1.2; strokeUV(ctx, list, W, H);
}
function redrawUv(){ for (const el of $('#slots').querySelectorAll('.slot')) el._uv?.(); }
function renderUvTools(){
  $('#uvOn').setAttribute('aria-pressed', state.uv);
  const box = $('#uvColors'); box.setAttribute('aria-disabled', !state.uv);
  for (const b of box.children) b.setAttribute('aria-pressed', b.dataset.c === state.uvColor);
}
for (const [c, nm] of UV_COLORS){
  const b = document.createElement('button'); b.dataset.c = c; b.style.background = c; b.title = `UV 선 ${nm}`; b.setAttribute('aria-label', `UV 선 ${nm}`);
  b.onclick = () => { state.uvColor = c; savePref('gd.uvc', c); renderUvTools(); redrawUv(); };
  $('#uvColors').append(b);
}
$('#uvOn').onclick = () => { state.uv = !state.uv; savePref('gd.uv', state.uv ? '1' : '0'); renderUvTools(); redrawUv(); };
const slotRO = new ResizeObserver(es => { for (const e of es) e.target.closest('.slot')?._uv?.(); });

/* ───────── 스킨 슬롯 ───────── */
function renderSlots(){
  const box = $('#slots'); box.textContent = ''; slotRO.disconnect();
  const slots = cur(state.item).slots;
  $('#slotCount').textContent = slots.length ? `${slots.length}장` : '';
  if (!slots.length){ box.innerHTML = '<div class="empty">이 장비는 바꿀 수 있는 텍스처가 없어요.</div>'; return; }
  for (const s of slots){
    const el = $('#slotTpl').content.firstElementChild.cloneNode(true);
    el.dataset.tex = s.tex;
    const img = el.querySelector('img'), file = el.querySelector('input'), drop = el.querySelector('.drop');
    const uvc = document.createElement('canvas'); uvc.className = 'uv'; uvc.hidden = true; img.after(uvc);
    el._uv = () => drawUvOverlay(s, uvc);
    slotRO.observe(drop);
    const err = el.querySelector('.err'), mine = () => state.custom[s.tex];
    const refresh = () => {
      img.src = mine()?.url || DATA + s.file;
      const st = el.querySelector('.state');
      st.textContent = mine() ? '내 스킨 적용 중' : '원본'; st.classList.toggle('mine', !!mine());
      el.querySelector('.reset').hidden = !mine();
    };
    const no = s.no || (slots.indexOf(s) + 1);
    const sub = s.fx ? '이펙트' : s.role === 'hand' ? '손' : s.role === 'body' ? '몸' : '본체';
    el.querySelector('.sname').innerHTML = `스킨 ${no}<small>${sub}</small>`;
    el.querySelector('.fxnote').hidden = !s.fx;
    el.querySelector('.size').textContent = `${s.w} × ${s.h} px`;
    el.querySelector('.fname').textContent = s.tex.replace(/\.\w+$/, '') + (s.alpha ? ' · 투명 영역 있음' : '');
    const showErr = msg => { err.hidden = !msg; err.querySelector('span').textContent = msg || ''; };
    const handle = async f => {
      showErr('');
      if (!f) return;
      if (!/\.(jpe?g)$/i.test(f.name) && f.type !== 'image/jpeg'){ showErr(`JPG 파일만 올릴 수 있어요. (올린 파일: ${f.name})`); return; }
      let bmp; try { bmp = await createImageBitmap(f); } catch { showErr('이미지를 읽지 못했어요. 다른 JPG로 다시 올려 주세요.'); return; }
      if (bmp.width !== s.w || bmp.height !== s.h){
        showErr(`크기가 맞지 않아요. 이 장비는 ${s.w}×${s.h}px 이어야 하는데, 올린 이미지는 ${bmp.width}×${bmp.height}px 이에요. 크기를 맞춰서 다시 올려 주세요.`);
        return;
      }
      await applySkin(s, bmp); refresh();
    };
    file.onchange = () => { handle(file.files[0]); file.value = ''; };
    el.querySelector('.up').onclick = () => file.click();
    for (const ev of ['dragenter','dragover']) drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.add('dragging'); });
    for (const ev of ['dragleave','drop']) drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.remove('dragging'); });
    drop.addEventListener('drop', e => handle(e.dataTransfer.files[0]));
    // 파츠 위치: 마우스를 올리면 미리 보기, '위치' 버튼(또는 제목 줄)을 누르면 고정/해제
    el.addEventListener('pointerenter', e => { if (e.pointerType === 'mouse'){ state.hover = s.tex; applyHighlight(); } });
    el.addEventListener('pointerleave', e => { if (e.pointerType === 'mouse' && state.hover === s.tex){ state.hover = null; applyHighlight(); } });
    const pin = () => { if (state.hl === 'off') return; state.pin = state.pin === s.tex ? null : s.tex; applyHighlight(); };
    el.querySelector('.loc').onclick = e => { e.stopPropagation(); pin(); };
    el.querySelector('.slot-title').onclick = pin; el.querySelector('.slot-title').style.cursor = 'pointer';
    el.querySelector('.dlTex').onclick = () => download(DATA + s.file, `${s.tex.replace(/\.\w+$/, '')}_원본.png`);
    el.querySelector('.dlUv').onclick = () => uvGuide(s, false);
    el.querySelector('.dlLine').onclick = () => uvGuide(s, true);
    el.querySelector('.reset').onclick = () => { const c = mine(); if (c){ URL.revokeObjectURL(c.url); delete state.custom[s.tex]; }
      const u = texUsers.get(s.tex); if (u) for (const m of u.mats){ m.map = m.userData.glow ? glowTexture(u.orig) : u.orig; m.needsUpdate = true; } refresh(); showErr(''); };
    refresh(); box.append(el);
  }
  applyHighlight();
}

// 올린 JPG를 모델에 입히기 (원본에 투명 영역이 있으면 그 모양은 그대로 유지)
async function applySkin(s, bmp){
  const cv = document.createElement('canvas'); cv.width = s.w; cv.height = s.h;
  const ctx = cv.getContext('2d'); ctx.drawImage(bmp, 0, 0);
  if (s.alpha){
    const o = await loadImage(DATA + s.file);
    const oc = document.createElement('canvas'); oc.width = s.w; oc.height = s.h;
    const octx = oc.getContext('2d'); octx.drawImage(o, 0, 0);
    const a = octx.getImageData(0,0,s.w,s.h).data, d = ctx.getImageData(0,0,s.w,s.h);
    for (let i = 3; i < a.length; i += 4) d.data[i] = a[i];
    ctx.putImageData(d, 0, 0);
  }
  const old = state.custom[s.tex]; if (old) URL.revokeObjectURL(old.url);
  const blob = await new Promise(r => cv.toBlob(r, 'image/png'));
  const tex = prepTex(new THREE.CanvasTexture(cv));
  state.custom[s.tex] = { url: URL.createObjectURL(blob), texture: tex };
  const u = texUsers.get(s.tex); if (u) for (const m of u.mats){ m.map = m.userData.glow ? glowTexture(tex) : tex; m.needsUpdate = true; }
}

// UV 가이드: 원본을 옅게 깔고 그 위에 UV 선을 그린 PNG / lineOnly 면 투명 배경에 선만 (선 색은 고른 색)
async function uvGuide(s, lineOnly){
  const cv = document.createElement('canvas'); cv.width = s.w; cv.height = s.h;
  const ctx = cv.getContext('2d');
  if (!lineOnly){
    ctx.fillStyle = '#fff'; ctx.fillRect(0,0,s.w,s.h);
    ctx.globalAlpha = 0.45; ctx.drawImage(await loadImage(DATA + s.file), 0, 0); ctx.globalAlpha = 1;
  }
  const c = state.uvColor;
  ctx.strokeStyle = (!lineOnly && c === '#ffffff') ? '#e0245e' : c;   // 흰 배경 가이드에 흰 선은 안 보이니 분홍으로
  ctx.lineWidth = Math.max(1, s.w / 512); ctx.lineJoin = 'round';
  strokeUV(ctx, await uvMeshes(s), s.w, s.h);
  download(cv.toDataURL('image/png'), `${s.tex.replace(/\.\w+$/, '')}_${lineOnly ? 'UV선' : 'UV가이드'}.png`);
}

/* ───────── 도우미 ───────── */
// 여성 치장이면 여성용 모델/스킨(있을 때만), 아니면 남성(공용)
// 용병 없는 장비 등급: 크로노 장비는 모두 유니크, 나머지는 레어
const UNIQUE_RE = /^크로노/;
const gradeOf = it => it.merc ? '' : (it.unique || UNIQUE_RE.test(it.name)) ? '유니크 장비' : it.rare ? '레어 장비' : '';
const cur = it => (state.gender === 'w' && it.female) ? it.female : it;
const partsOf = v => v.parts || [{ role:'equip', mesh:v.mesh, file:v.file, materials:v.materials }];
// 아이콘은 수치 사전(skill_dictionary.html)과 같은 방식: items.json 안에 base64(webp)로 들어 있음
function iconSrc(it){
  const b = it.icon && state.db.icons?.[it.icon]; if (!b) return '';
  return `data:image/${b.startsWith('iVBOR') ? 'png' : b.startsWith('/9j/') ? 'jpeg' : 'webp'};base64,${b}`;
}
function loadImage(src){ return new Promise((ok, no) => { const i = new Image(); i.crossOrigin = 'anonymous'; i.onload = () => ok(i); i.onerror = no; i.src = src; }); }
function download(href, name){ const a = document.createElement('a'); a.href = href; a.download = name; document.body.append(a); a.click(); a.remove(); }
function toast(msg){ const m = $('#smsg'); m.hidden = false; m.textContent = msg; setTimeout(() => { if (state.item) m.hidden = true; }, 2200); }

renderHlMode(); renderUvTools();
init();
</script>
